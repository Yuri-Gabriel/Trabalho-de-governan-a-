{% extends 'base.html' %}
{% block content %}
<section class="card">
  <h2>{{ titulo }}</h2>
  <p>Tem certeza que deseja excluir: <strong>{{ descricao }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Excluir</button>
    <a class="btn" href="{{ voltar_url }}">Cancelar</a>
  </form>
</section>
{% endblock %}
